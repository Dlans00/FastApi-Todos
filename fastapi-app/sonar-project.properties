# 프로젝트 기본 정보
sonar.projectKey=fastapi_app_claude_experiment
sonar.projectName=FastAPI App Claude Sonar Experiment
sonar.projectVersion=1.0

# SonarQube 서버 URL
sonar.host.url=http://163.239.77.71:9000

# 소스 코드 위치
sonar.sources=.

# 테스트 코드 위치
sonar.tests=tests

# Python 버전 (정확한 분석을 위해 명시)
sonar.python.version=3.10

# 커버리지 리포트 (pytest 사용 시)
sonar.python.coverage.reportPaths=coverage.xml

# 불필요 파일 제외 (분석 정확도 향상)
sonar.exclusions=**/*.js,**/*.css,**/*.html,**/__pycache__/**,**/.venv/**,**/venv/**

# 테스트 파일 제외 (중복 분석 방지)
sonar.test.exclusions=**/tests/**

# 인코딩 설정
sonar.sourceEncoding=UTF-8

# 로그를 더 자세히 보고 싶을 때
sonar.verbose=true